name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install "conan>=2.7,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Configure Conan remotes
        run: |
          conan remote remove conancenter || true
          conan remote add conancenter https://center2.conan.io

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py', 'conan/profiles/*') }}

      - name: Conan install
        run: conan install . -of build/build-codex/conan -pr:h conan/profiles/linux-gcc-debug -pr:b conan/profiles/linux-gcc-debug --build=missing

      - name: Configure CMake (Conan toolchain)
        run: cmake --preset conan-debug

      - name: Guard Conan toolchain
        run: test -f build/build-codex/CMakeCache.txt && grep -q "conan_toolchain.cmake" build/build-codex/CMakeCache.txt

      - name: Build
        run: cmake --build --preset build-debug

      - name: Test
        run: ctest --preset test-debug
